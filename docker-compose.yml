services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_NAME: "Transport Herd"
      APP_ENV: dev
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: transport_herd
      DB_USERNAME: transport_herd
      DB_PASSWORD: dev_password
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_LEVEL: debug
    depends_on:
      - mysql
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - transport-network
    develop:
      watch:
        - path: ./app
          target: /var/www/html/app
          action: sync
        - path: ./resources
          target: /var/www/html/resources
          action: sync
        - path: ./routes
          target: /var/www/html/routes
          action: rebuild
        - path: ./config
          target: /var/www/html/config
          action: rebuild

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: transport_herd
      MYSQL_USER: transport_herd
      MYSQL_PASSWORD: dev_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - transport-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  transport-network:
    driver: bridge

volumes:
  mysql_data:
