databases:
  - name: fhws-transport-db
    plan: free
    databaseName: fhws_transport
    user: fhws_transport

services:
  - type: web
    name: fhws-transport
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Faculty of Health and Wellness Sciences"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://fhwstransportv2-1.onrender.com
      - key: RENDER
        value: "true"
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: fhws-transport-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fhws-transport-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: fhws-transport-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: fhws-transport-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fhws-transport-db
          property: password
