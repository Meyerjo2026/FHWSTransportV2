apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transport-herd-ingress
  namespace: transport-herd-dev
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - transport-herd.example.com
    secretName: transport-herd-tls
  rules:
  - host: transport-herd.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: transport-herd
            port:
              number: 80

---
apiVersion: v1
kind: Service
metadata:
  name: transport-herd
  namespace: transport-herd-dev
  labels:
    app: transport-herd
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: transport-herd
