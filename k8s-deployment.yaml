apiVersion: v1
kind: Namespace
metadata:
  name: transport-herd-dev

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: transport-herd-config
  namespace: transport-herd-dev
data:
  APP_NAME: "Transport Herd"
  APP_ENV: "dev"
  APP_DEBUG: "true"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "debug"
  DB_CONNECTION: "mysql"
  SESSION_DRIVER: "database"
  BROADCAST_CONNECTION: "log"
  FILESYSTEM_DISK: "local"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"
  MAIL_MAILER: "log"

---
apiVersion: v1
kind: Secret
metadata:
  name: transport-herd-secrets
  namespace: transport-herd-dev
type: Opaque
stringData:
  APP_KEY: "base64:change_me_to_your_app_key"
  DB_HOST: "mysql.transport-herd-dev"
  DB_PORT: "3306"
  DB_DATABASE: "transport_herd"
  DB_USERNAME: "transport_herd"
  DB_PASSWORD: "change_me_to_secure_password"
  APP_URL: "http://transport-herd.example.com"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-herd-app
  namespace: transport-herd-dev
  labels:
    app: transport-herd
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transport-herd
  template:
    metadata:
      labels:
        app: transport-herd
        version: v1
    spec:
      # Uncomment below if using private registry
      # imagePullSecrets:
      # - name: ghcr-secret
      containers:
      - name: app
        image: transport-herd:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: transport-herd-config
        - secretRef:
            name: transport-herd-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: transport-herd
  namespace: transport-herd-dev
  labels:
    app: transport-herd
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: transport-herd
